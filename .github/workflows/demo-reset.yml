# Puts the public demo back to its made-up starting data once a day (stage 94), so
# visitors' changes don't pile up. Needs, in GitHub > Settings > Secrets and variables:
#   secret   DEMO_RESET_TOKEN  (the same value as on Render)
#   variable DEMO_API_URL      (the Render backend URL, e.g. https://career-ai-api.onrender.com)
name: Reset the public demo

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch: {}   # and a "Run workflow" button for a manual reset

jobs:
  reset:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_API_URL != '' }}
    steps:
      - name: Wake the backend (free servers sleep when idle)
        run: curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 "${{ vars.DEMO_API_URL }}/health"
      - name: Reset to the demo data
        run: |
          curl --fail --silent --show-error --max-time 120 -X POST \
            -H "X-Demo-Token: ${{ secrets.DEMO_RESET_TOKEN }}" \
            "${{ vars.DEMO_API_URL }}/demo/reset"
