# Keeps the free Render backend awake (stage 102). Free servers sleep after ~15 minutes
# without visitors, and the next visitor then waits up to a minute while it wakes. A
# tiny /health call every 10 minutes prevents that. Uses the repository variable
# DEMO_API_URL (the Render address, e.g. https://career-ai-api-gpse.onrender.com).
# GitHub may run scheduled jobs a few minutes late, and pauses them after 60 days
# without commits; re-enable it from the Actions tab if that happens.
name: Keep the backend awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_API_URL != '' }}
    timeout-minutes: 3
    steps:
      - name: Call /health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "${{ vars.DEMO_API_URL }}/health"
