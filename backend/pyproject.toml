[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-ai-backend"
version = "0.1.0"
description = "Backend for the Career AI application"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Starlette's TestClient still uses an anyio name that anyio 4.x deprecated. It's inside
# the library, not our code; remove this line once Starlette is updated.
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
